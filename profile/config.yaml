model:
  default: antigravity/gemini-3.8-flash-low
  api_mode: chat_completions
  provider: first-time
  base_url: http://127.0.0.1:20128/v1
  key_env: HERMES_CUSTOM_FIRST_TIME_API_KEY
  context_length: 1048576
  aliases:
    flash: antigravity/gemini-3.8-flash-low
    flash-low: antigravity/gemini-3.8-flash-low
    gemini: antigravity/gemini-3.8-flash-low
    fast: antigravity/gemini-3.8-flash-low
    chat: antigravity/gemini-3.8-flash-low
    casual: antigravity/gemini-3.8-flash-low
    low: antigravity/gemini-3.8-flash-low
    medium: antigravity/gemini-3.8-flash-medium
    flash-medium: antigravity/gemini-3.8-flash-medium
    custodian: antigravity/gemini-3.8-flash-high
    vault: antigravity/gemini-3.8-flash-high
    high: antigravity/gemini-3.8-flash-high
    flash-high: antigravity/gemini-3.8-flash-high
    thinking: antigravity/gemini-3.8-flash-high
    pro: antigravity/gemini-3.8-flash-high
    claude: antigravity/claude-sonnet-4-6
    sonnet: antigravity/claude-sonnet-4-6
    opus: antigravity/claude-opus-4-6-thinking

providers:
  first-time:
    name: omnirouter
    base_url: http://127.0.0.1:20128/v1
    model: antigravity/gemini-3.8-flash-low
    key_env: HERMES_CUSTOM_FIRST_TIME_API_KEY
    discover_models: false

fallback_providers:
  - provider: first-time
    model: antigravity/gemini-3.8-flash-medium
    base_url: http://127.0.0.1:20128/v1
    key_env: HERMES_CUSTOM_FIRST_TIME_API_KEY
  - provider: first-time
    model: antigravity/gemini-3.8-flash-high
    base_url: http://127.0.0.1:20128/v1
    key_env: HERMES_CUSTOM_FIRST_TIME_API_KEY
  - provider: first-time
    model: antigravity/claude-sonnet-4-6
    base_url: http://127.0.0.1:20128/v1
    key_env: HERMES_CUSTOM_FIRST_TIME_API_KEY

compression:
  enabled: false

auxiliary:
  vision:
    provider: first-time
    model: antigravity/gemini-3.8-flash-low
    base_url: http://127.0.0.1:20128/v1
    key_env: HERMES_CUSTOM_FIRST_TIME_API_KEY

voice:
  auto_tts: false

tts:
  provider: edge
  voice: en-GB-RyanNeural

stt:
  enabled: true
  provider: local_command

terminal:
  timeout: 300

agent:
  intent_ack_continuation: true
  tool_use_enforcement: true
  execution_guidance: true
  stall_guards: true
  task_completion_guidance: true
  api_max_retries: 2
  # Note: Hermes native browser/computer_use toolsets stay disabled to preserve 1GB RAM;
  # website automation runs via ephemeral single-instance Playwright (portal_automation.py / mission_engine.py).
  # IMPORTANT: Do NOT put `browser` in disabled_toolsets because Hermes's `browser` toolset includes `web_search`,
  # which would silently strip `web_search` from the `web` toolset. `platform_toolsets.telegram` already omits `browser`.
  disabled_toolsets:
    - computer_use
    - video_gen
    - image_gen
    - delegation
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - yuanbao
    - x_search
    - kanban

platform_toolsets:
  telegram:
    - terminal
    - file
    - code_execution
    - web
    - video
    - skills
    - memory
    - clarify
    - todo
    - tts

slash_commands:
  confirm_new: false
  confirm_reset: false
