  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #0b0d11;
      font-family: 'Google Sans', system-ui, sans-serif;
      color: #f1f3f4;
    }

    .grid-bg {
      position: absolute; inset: 0;
      background-image: 
        radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.05) 1px, transparent 0),
        linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 28px 28px, 140px 140px, 140px 140px;
      pointer-events: none; z-index: 0;
    }

    #viewport {
      position: absolute; inset: 0; overflow: hidden;
      cursor: grab; z-index: 1;
    }
    #viewport.dragging { cursor: grabbing; }

    #graph-container {
      position: absolute; transform-origin: 0 0;
      transition: transform 0.04s ease-out;
    }

    .controls-hud {
      position: fixed; bottom: 24px; right: 24px; z-index: 100;
      background: rgba(20, 24, 33, 0.92); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
      padding: 6px; display: flex; align-items: center; gap: 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    .hud-btn {
      background: transparent; border: none; color: #f1f3f4;
      width: 38px; height: 38px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s ease;
    }
    .hud-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .zoom-level {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      padding: 0 10px; color: #9aa0a6; min-width: 60px; text-align: center;
    }

    .hint-hud {
      position: fixed; bottom: 24px; left: 24px; z-index: 100;
      background: rgba(20, 24, 33, 0.88); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px; padding: 8px 14px; font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: #9aa0a6; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    svg { display: block; }
    .node-card {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .node-card:hover {
      filter: brightness(1.15) drop-shadow(0 0 16px rgba(138, 180, 248, 0.3));
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dash 3s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -28; }
    }
  </style>
</head>

  <script>
    const viewport = document.getElementById('viewport');
    const container = document.getElementById('graph-container');
    const zoomText = document.getElementById('zoom-text');

    let scale = 0.35;
    let pointX = 30;
    let pointY = 30;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    function updateTransform() {
      container.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      zoomText.textContent = `${Math.round(scale * 100)}%`;
    }

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.controls-hud')) return;
      isPanning = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
      viewport.classList.add('dragging');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      viewport.classList.remove('dragging');
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.15;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      let newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
      newScale = Math.min(Math.max(0.08, newScale), 10.0);

      pointX = mouseX - (mouseX - pointX) * (newScale / scale);
      pointY = mouseY - (mouseY - pointY) * (newScale / scale);
      scale = newScale;
      updateTransform();
    }, { passive: false });

    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      scale = Math.min(scale * 1.25, 10.0);
      updateTransform();
    });
    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      scale = Math.max(scale / 1.25, 0.08);
      updateTransform();
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      fitToScreen();
    });

    function fitToScreen() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const scaleX = (vw - 60) / 4400;
      const scaleY = (vh - 60) / 3000;
      scale = Math.min(Math.max(Math.min(scaleX, scaleY), 0.12), 1.0);
      pointX = (vw - 4400 * scale) / 2;
      pointY = (vh - 3000 * scale) / 2;
      if (pointY < 20) pointY = 20;
      updateTransform();
    }
    document.getElementById('btn-fit').addEventListener('click', fitToScreen);

    window.addEventListener('load', () => {
      fitToScreen();
    });
  </script>
